name: Server random bank generator and refill security tests
on:
  push:
    branches: [main]
    paths:
      - tools/random-bank-generator.mjs
      - tools/random-bank-refill-core.mjs
      - sat-nonogram-solver.js
      - tools/random-bank-initial-fill-core.mjs
      - tools/plan-random-bank-initial-fill.mjs
      - .github/workflows/server-random-bank-initial-fill.yml
      - tools/random-bank-usage-metrics.mjs
      - tools/check-random-bank-usage.mjs
      - tests/random-bank-usage.mjs
      - .github/workflows/server-random-bank-usage.yml
      - tools/random-bank-admin.mjs
      - tools/random-bank-live-rules.mjs
      - tools/activate-random-bank-rules.mjs
      - .github/workflows/activate-random-bank.yml
      - tools/refill-random-bank.mjs
      - tools/run-spark-random-pilot.mjs
      - tests/spark-random-pilot.mjs
      - .github/workflows/server-random-bank-spark-pilot.yml
      - random-puzzle-allocation.js
      - database.rules.json
      - tests/random-bank-server.mjs
      - tests/random-puzzle-bank-rules.cjs
      - .github/workflows/server-random-bank-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install professional CaDiCaL and Firebase emulator tools
        run: npm ci
      - name: Check source syntax and Firebase rules JSON
        run: |
          node --check tools/random-bank-generator.mjs
          node --check sat-nonogram-solver.js
          node --check tools/random-bank-admin.mjs
          node --check tools/random-bank-usage-metrics.mjs
          node --check tools/check-random-bank-usage.mjs
          node --check tests/random-bank-usage.mjs
          node --check tools/random-bank-live-rules.mjs
          node --check tools/activate-random-bank-rules.mjs
          node --check tools/random-bank-refill-core.mjs
          node --check tools/random-bank-initial-fill-core.mjs
          node --check tools/plan-random-bank-initial-fill.mjs
          node --check tools/refill-random-bank.mjs
          node --check tools/run-spark-random-pilot.mjs
          node --check tests/spark-random-pilot.mjs
          node --check tests/random-bank-server.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('database.rules.json','utf8'))"
      - name: Test initial burst safety caps, 100-stock planner, refill, proof and credentials
        run: node tests/random-bank-server.mjs
      - name: Test one-time Spark pilot stock and resource caps
        run: node tests/spark-random-pilot.mjs
      - name: Test no-cost Firebase quota telemetry and fail-closed decisions
        run: node tests/random-bank-usage.mjs
      - name: Test Firebase bank and restock request security
        run: npx firebase emulators:exec --project demo-nono --only database,auth "node tests/random-puzzle-bank-rules.cjs"
