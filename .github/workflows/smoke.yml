name: NONO smoke test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify visual-world-builder skill
        run: |
          node .agents/skills/visual-world-builder/scripts/test-audit.mjs
          node .agents/skills/visual-world-builder/scripts/audit-contract.mjs .agents/skills/visual-world-builder/assets/theme-contract.example.json
      - name: Install test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check locale.js
          node --check locale-packs.js
          node --check locale-settings-packs.js
          node --check locale-en-extra.js
          node --check tests/locale.cjs
          node --check tests/i18n-audit.cjs
          node --check settings.js
          node --check themes.js
          node --check daily-rewards.js
          node --check shop.js
          node --check tests/shop.cjs
          node --check tests/daily-rewards.cjs
      - name: Verify language switching and persistence
        run: node tests/locale.cjs
      - name: Audit translated UI coverage
        run: node tests/i18n-audit.cjs
      - name: Verify unified shop and browser theme unlocks
        run: node tests/shop.cjs
      - name: Verify daily missions and check-in
        run: node tests/daily-rewards.cjs
      - name: Verify completed VOX preview mode
        run: node tests/voxel-preview.cjs
      - name: Run browser test
        run: node tests/smoke.cjs
      - name: Validate database security rules
        run: npm run test:multiplayer
      - name: Check two-browser multiplayer
        run: npm run test:browser
