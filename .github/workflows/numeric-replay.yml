name: NONO numeric replay validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator dependencies
        run: npm ci
      - name: Check replay and game integration syntax
        run: |
          node --check numeric-replay.js
          node --check replay-client.js
          node --check cloud-replays.js
          node --check multiplayer-replay.js
          node --check settings.js
          node --check tests/replay.cjs
          node --check tests/multiplayer-replay.cjs
          node --check tests/browser-replay.cjs
      - name: Numeric replay actions and persistence
        run: |
          node tests/replay.cjs
          node tests/multiplayer-replay.cjs
      - name: Ensure replay assets are in deploy build
        run: |
          node tools/build.cjs
          test -s dist/numeric-replay.js
          test -s dist/replay-client.js
          test -s dist/cloud-replays.js
          test -s dist/multiplayer-replay.js
          grep -q './numeric-replay.js' dist/index.html
          grep -q './replay-client.js' dist/index.html
          grep -q './cloud-replays.js' dist/index.html
          grep -q './multiplayer-replay.js' dist/index.html
      - name: Validate Firebase replay permissions in emulator
        run: npm run test:multiplayer
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser replay and two-user co-op smoke
        run: npx firebase emulators:exec --project demo-nono --only database,auth "node tests/browser-replay.cjs"
