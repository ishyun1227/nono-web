name: Random puzzle generator checks
on:
  push:
    branches: [main]
    paths:
      - random-puzzle-solver.js
      - sat-nonogram-solver.js
      - random-puzzles.js
      - package-lock.json
      - package.json
      - tests/cadical-integration.mjs
      - tests/benchmark-cadical-five-seconds.mjs
      - random-unique-worker.js
      - apple-home.js
      - apple-home.css
      - index.html
      - tools/build.cjs
      - tests/random-puzzles.cjs
      - tests/async-random-generator.cjs
      - tests/sat-uniqueness.cjs
      - tests/benchmark-sat-uniqueness.cjs
      - .github/workflows/random-puzzles.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generated-puzzles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all size and difficulty combinations
        run: node tests/random-puzzles.cjs
      - name: Check browser Worker generator contract
        run: node tests/async-random-generator.cjs
      - name: Cross-check SAT solver against exhaustive solutions
        run: node tests/sat-uniqueness.cjs
      - name: Install pinned CaDiCaL and build deploy bundle
        run: |
          npm ci
          npm run build
      - name: Verify professional CDCL uniqueness proofs
        run: node tests/cadical-integration.mjs
      - name: Benchmark real CaDiCaL 5-second puzzle limits up to 100x100
        run: node tests/benchmark-cadical-five-seconds.mjs
